name: Update Base Locks
run-name: Dispatch update-package-versions-worker.yml at latest release branch

"on":
  # Weekly on Tuesday at 02:08 UTC
  schedule:
    - cron: "8 2 * * 2"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:

  latest-release-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest release branch
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_release_tag="$(
            curl \
              -fsSL \
              --retry 8 \
              --retry-all-errors \
              --retry-delay 2 \
              --max-time 300 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
            | jq -r '.tag_name'
          )"
          if [[ -z "${latest_release_tag}" ]]; then
            echo "Latest release tag is empty" >&2
            exit 1
          fi

          base_version="${latest_release_tag}"
          if [[ "${latest_release_tag}" =~ ^(.+)-[0-9]{8}T[0-9]{4}$ ]]; then
            base_version="${BASH_REMATCH[1]}"
          fi

          {
            echo "BASE_VERSION=${base_version}"
            echo "RELEASE_BRANCH=release/${base_version}"
          } >> "$GITHUB_OUTPUT"
          echo "Latest release branch: release/${base_version}"

      - name: Dispatch update-package-versions worker at release branch
        env:
          BASE_VERSION: ${{ steps.latest.outputs.BASE_VERSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.latest.outputs.RELEASE_BRANCH }}
        run: |
          set -euo pipefail
          gh workflow run update-package-versions-worker.yml \
            --ref "${RELEASE_BRANCH}" \
            --repo "${GITHUB_REPOSITORY}" \
            -f "base_version=${BASE_VERSION}" \
            -f "release_branch=${RELEASE_BRANCH}"
