name: Update Package Versions
run-name: Update package versions

"on":
  # Daily at 03:17 UTC
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: update-package-versions
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  RUNNER_AMD64: ubuntu-latest
  RUNNER_ARM64: ubuntu-24.04-arm

jobs:
  matrix:
    name: Prepare package version matrix
    runs-on: ubuntu-latest
    env:
      ROOT_DIR: ${{ github.workspace }}
    outputs:
      MATRIX: ${{ steps.matrix.outputs.MATRIX }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Generate matrix
        id: matrix
        run: |
          set -euo pipefail
          source scripts/common.sh
          load_config_file

          matrix_file="$(mktemp)"
          echo '{"include":[]}' >"${matrix_file}"

          while IFS= read -r base_alias; do
            base_matrix="$(BASE_ALIAS="${base_alias}" scripts/ci/base-build-matrix.sh)"
            jq -c \
              --arg base "${base_alias}" \
              --argjson base_matrix "${base_matrix}" \
              '.include += ($base_matrix.include | map(. + {"base": $base}))' \
              "${matrix_file}" >"${matrix_file}.tmp"
            mv "${matrix_file}.tmp" "${matrix_file}"
          done < <(list_configured_bases)

          printf 'MATRIX=%s\n' "$(cat "${matrix_file}")" >>"${GITHUB_OUTPUT}"

  resolve:
    name: "${{ matrix.base }}/${{ matrix.arch }}: Resolve package versions"
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.MATRIX) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install resolver dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m pip uninstall -y yq

      - name: Resolve package versions
        env:
          BASE_ALIAS: ${{ matrix.base }}
        run: |
          set -euo pipefail
          scripts/packages/resolve.sh "${BASE_ALIAS}"

      - name: Prepare package version artifact
        env:
          ARCH: ${{ matrix.arch }}
          BASE_ALIAS: ${{ matrix.base }}
        run: |
          set -euo pipefail
          mkdir -p "package-version-artifact/bases/${BASE_ALIAS}/packages"
          cp \
            "bases/${BASE_ALIAS}/packages/${ARCH}.yml" \
            "bases/${BASE_ALIAS}/packages/${ARCH}.env" \
            "package-version-artifact/bases/${BASE_ALIAS}/packages/"

      - name: Upload package versions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: package-versions-${{ matrix.base }}-${{ matrix.arch }}
          path: package-version-artifact/bases

  commit:
    name: Commit package version updates
    needs: resolve
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download resolved package versions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: package-versions-*
          path: bases
          merge-multiple: true

      - name: Commit and push changes
        uses: IAreKyleW00t/verified-bot-commit@1ccc6afd0f789e8442cff7deec3e9856a693cc7e  # v2.3.4
        with:
          message: Update package versions
          files: bases/**/packages/**
          if-no-commit: info
