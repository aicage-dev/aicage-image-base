name: Release
run-name: Release (${{ github.ref_name }})

"on":
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:

  verify-tagged-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      BASE_VERSION: ${{ steps.release-line.outputs.BASE_VERSION }}
      IS_REFRESH_TAG: ${{ steps.release-line.outputs.IS_REFRESH_TAG }}
      RELEASE_BRANCH: ${{ steps.release-line.outputs.RELEASE_BRANCH }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine release line
        id: release-line
        run: |
          set -euo pipefail
          base_version="${GITHUB_REF_NAME}"
          is_refresh_tag="false"
          if [[ "${GITHUB_REF_NAME}" =~ ^(.+)-[0-9]{8}T[0-9]{4}$ ]]; then
            base_version="${BASH_REMATCH[1]}"
            is_refresh_tag="true"
          fi

          {
            echo "BASE_VERSION=${base_version}"
            echo "IS_REFRESH_TAG=${is_refresh_tag}"
            echo "RELEASE_BRANCH=release/${base_version}"
          } >>"${GITHUB_OUTPUT}"

      - name: Verify tagged commit is on the expected branch
        env:
          IS_REFRESH_TAG: ${{ steps.release-line.outputs.IS_REFRESH_TAG }}
          RELEASE_BRANCH: ${{ steps.release-line.outputs.RELEASE_BRANCH }}
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          expected_branch="origin/main"
          if [[ "${IS_REFRESH_TAG}" == "true" ]]; then
            expected_branch="origin/${RELEASE_BRANCH}"
          fi

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "${expected_branch}"; then
            echo "Tag ${GITHUB_REF_NAME} points to ${GITHUB_SHA}," >&2
            echo "but that commit is not on ${expected_branch}." >&2
            exit 1
          fi

      - name: Create release branch
        if: steps.release-line.outputs.IS_REFRESH_TAG == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.release-line.outputs.RELEASE_BRANCH }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "${RELEASE_BRANCH}" >/dev/null; then
            remote_sha="$(git ls-remote --heads origin "${RELEASE_BRANCH}" | awk '{print $1}')"
            if [[ "${remote_sha}" != "${GITHUB_SHA}" ]]; then
              echo "${RELEASE_BRANCH} already exists at ${remote_sha}, expected ${GITHUB_SHA}" >&2
              exit 1
            fi
            exit 0
          fi

          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${GITHUB_SHA}:refs/heads/${RELEASE_BRANCH}"

  refresh-base-locks:
    runs-on: ubuntu-latest
    needs: verify-tagged-commit
    if: needs.verify-tagged-commit.outputs.IS_REFRESH_TAG == 'false'
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch base lock refresh
        env:
          BASE_VERSION: ${{ needs.verify-tagged-commit.outputs.BASE_VERSION }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ needs.verify-tagged-commit.outputs.RELEASE_BRANCH }}
        run: |
          set -euo pipefail
          gh workflow run update-package-versions-worker.yml \
            --ref "${RELEASE_BRANCH}" \
            --repo "${GITHUB_REPOSITORY}" \
            -f "base_version=${BASE_VERSION}" \
            -f "release_branch=${RELEASE_BRANCH}"

  build-images:
    needs: verify-tagged-commit
    if: needs.verify-tagged-commit.outputs.IS_REFRESH_TAG == 'true'
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-all-images-worker.yml

  release:
    runs-on: ubuntu-latest
    needs: [build-images, verify-tagged-commit]
    if: needs.verify-tagged-commit.outputs.IS_REFRESH_TAG == 'true'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Release: Package release artifacts"
        run: |
          set -euo pipefail
          ROOT_DIR="${GITHUB_WORKSPACE}"
          export ROOT_DIR
          mkdir -p dist
          source scripts/common.sh
          load_config_file

          artifact_dir="$(mktemp -d)"
          mkdir -p "${artifact_dir}/bases" "${artifact_dir}/scripts"
          # add filtered bases
          while IFS= read -r base_alias; do
            cp -a "bases/${base_alias}" "${artifact_dir}/bases/"
          done < <(list_configured_bases)
          # add tests
          cp -a tests "${artifact_dir}/"
          # add scripts
          cp -a scripts/os-installers scripts/entrypoint.sh "${artifact_dir}/scripts/"

          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          tar -czf dist/"${REPO_NAME}".tar.gz \
            -C "${artifact_dir}" \
              bases \
              tests \
              scripts
          tar -czf dist/"${REPO_NAME}"-smoke-tests.tar.gz \
            tests/bases/smoke
          rm -rf "${artifact_dir}"

      - name: "Release: Create SHA256SUMS"
        run: |
          set -euo pipefail
          cd dist
          LC_ALL=C find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 | \
            sort -z | \
            xargs -0 sha256sum \
            > SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: "Release: Keyless-sign SHA256SUMS"
        run: |
          set -euo pipefail
          cd dist
          cosign sign-blob --yes \
            --bundle SHA256SUMS.sigstore.json \
            SHA256SUMS

      - name: "Release: Create GitHub release"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET_SHA}" \
            --generate-notes
