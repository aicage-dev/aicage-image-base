name: Release
run-name: Release (${{ github.ref_name }})

"on":
  push:
    tags:
      - "*.*.*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:

  verify-tagged-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      BASE_VERSION: ${{ steps.release-line.outputs.BASE_VERSION }}
      RELEASE_BRANCH: ${{ steps.release-line.outputs.RELEASE_BRANCH }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine release line
        id: release-line
        run: |
          set -euo pipefail
          base_version="${GITHUB_REF_NAME}"
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v?[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            base_version="${GITHUB_REF_NAME%-*}"
          fi

          {
            echo "BASE_VERSION=${base_version}"
            echo "RELEASE_BRANCH=release/${base_version}"
          } >>"${GITHUB_OUTPUT}"

      - name: Create release branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.release-line.outputs.RELEASE_BRANCH }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "${RELEASE_BRANCH}" >/dev/null; then
            echo "Branch ${RELEASE_BRANCH} already exists." >&2
            exit 0
          fi

          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${GITHUB_SHA}:refs/heads/${RELEASE_BRANCH}"

      - name: Verify tagged commit is on the release branch
        env:
          RELEASE_BRANCH: ${{ steps.release-line.outputs.RELEASE_BRANCH }}
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${RELEASE_BRANCH}"; then
            echo "Tag ${GITHUB_REF_NAME} points to ${GITHUB_SHA}," >&2
            echo "but that commit is not on origin/${RELEASE_BRANCH}." >&2
            exit 1
          fi

  refresh-base-locks:
    needs: verify-tagged-commit
    permissions:
      actions: read
      contents: write
      pull-requests: write
    uses: ./.github/workflows/update-package-versions-worker.yml
    with:
      base_version: ${{ needs.verify-tagged-commit.outputs.BASE_VERSION }}
      release_tag: ${{ github.ref_name }}
      release_sha: ${{ github.sha }}
      release_branch: ${{ needs.verify-tagged-commit.outputs.RELEASE_BRANCH }}

  build-images:
    needs: refresh-base-locks
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-all-images-worker.yml
    with:
      git_ref: ${{ needs.refresh-base-locks.outputs.release_tag }}

  release:
    runs-on: ubuntu-latest
    needs: [build-images, refresh-base-locks]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Release: Package release artifacts"
        run: |
          set -euo pipefail
          ROOT_DIR="${GITHUB_WORKSPACE}"
          export ROOT_DIR
          mkdir -p dist
          source scripts/common.sh
          load_config_file

          artifact_dir="$(mktemp -d)"
          mkdir -p "${artifact_dir}/bases" "${artifact_dir}/scripts"
          # add filtered bases
          while IFS= read -r base_alias; do
            cp -a "bases/${base_alias}" "${artifact_dir}/bases/"
          done < <(list_configured_bases)
          # add tests
          cp -a tests "${artifact_dir}/"
          # add scripts
          cp -a scripts/os-installers scripts/entrypoint.sh "${artifact_dir}/scripts/"

          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          tar -czf dist/"${REPO_NAME}".tar.gz \
            -C "${artifact_dir}" \
              bases \
              tests \
              scripts
          tar -czf dist/"${REPO_NAME}"-smoke-tests.tar.gz \
            tests/bases/smoke
          rm -rf "${artifact_dir}"

      - name: "Release: Create SHA256SUMS"
        run: |
          set -euo pipefail
          cd dist
          LC_ALL=C find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 | \
            sort -z | \
            xargs -0 sha256sum \
            > SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: "Release: Keyless-sign SHA256SUMS"
        run: |
          set -euo pipefail
          cd dist
          cosign sign-blob --yes \
            --bundle SHA256SUMS.sigstore.json \
            SHA256SUMS

      - name: "Release: Create GitHub release"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.refresh-base-locks.outputs.release_tag }}
          TARGET_SHA: ${{ needs.refresh-base-locks.outputs.release_sha }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET_SHA}" \
            --generate-notes
