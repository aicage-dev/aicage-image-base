name: Update Base Locks
run-name: Update base locks at latest release branch

"on":
  # Weekly on Tuesday at 02:08 UTC
  schedule:
    - cron: "8 2 * * 2"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

jobs:

  latest-release-branch:
    runs-on: ubuntu-latest
    outputs:
      BASE_VERSION: ${{ steps.latest.outputs.BASE_VERSION }}
      LATEST_RELEASE_TAG: ${{ steps.latest.outputs.LATEST_RELEASE_TAG }}
    steps:
      - name: Get latest release branch
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_release_tag="$(
            curl \
              -fsSL \
              --retry 8 \
              --retry-all-errors \
              --retry-delay 2 \
              --max-time 300 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
            | jq -r '.tag_name'
          )"
          if [[ -z "${latest_release_tag}" ]]; then
            echo "Latest release tag is empty" >&2
            exit 1
          fi

          base_version="${latest_release_tag}"
          if [[ ! "${latest_release_tag}" =~ ^v?[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            base_version="${latest_release_tag%-*}"
          fi

          {
            echo "BASE_VERSION=${base_version}"
            echo "LATEST_RELEASE_TAG=${latest_release_tag}"
          } >> "$GITHUB_OUTPUT"
          echo "Latest release branch: release/${base_version}"

  refresh-base-locks:
    needs: latest-release-branch
    permissions:
      actions: read
      contents: write
      pull-requests: write
    uses: ./.github/workflows/update-package-versions-worker.yml
    with:
      base_version: ${{ needs.latest-release-branch.outputs.BASE_VERSION }}
      release_tag: ${{ needs.latest-release-branch.outputs.LATEST_RELEASE_TAG }}

  dispatch-release:
    needs: refresh-base-locks
    if: needs.refresh-base-locks.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.refresh-base-locks.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --ref "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}"
