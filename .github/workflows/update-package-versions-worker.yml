name: Update Base Locks Worker
run-name: Update base locks (${{ github.ref_name }})

"on":
  workflow_call:
    inputs:
      base_version:
        description: Release version backing this release branch
        required: true
        type: string
  workflow_dispatch:
    inputs:
      base_version:
        description: Release version backing this release branch
        required: true
        type: string

concurrency:
  group: update-base-locks-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  RUNNER_AMD64: ubuntu-latest
  RUNNER_ARM64: ubuntu-24.04-arm

jobs:
  matrix:
    name: Prepare base lock matrix
    runs-on: ubuntu-latest
    env:
      ROOT_DIR: ${{ github.workspace }}
    outputs:
      BASE_MATRIX: ${{ steps.matrix.outputs.BASE_MATRIX }}
      PACKAGE_MATRIX: ${{ steps.matrix.outputs.PACKAGE_MATRIX }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Generate matrix
        id: matrix
        run: |
          set -euo pipefail
          source scripts/common.sh
          load_config_file

          base_matrix_file="$(mktemp)"
          package_matrix_file="$(mktemp)"
          echo '{"include":[]}' >"${base_matrix_file}"
          echo '{"include":[]}' >"${package_matrix_file}"

          while IFS= read -r base_alias; do
            jq -c \
              --arg base "${base_alias}" \
              '.include += [{"base": $base}]' \
              "${base_matrix_file}" >"${base_matrix_file}.tmp"
            mv "${base_matrix_file}.tmp" "${base_matrix_file}"

            base_matrix="$(BASE_ALIAS="${base_alias}" scripts/ci/base-build-matrix.sh)"
            jq -c \
              --arg base "${base_alias}" \
              --argjson base_matrix "${base_matrix}" \
              '.include += ($base_matrix.include | map(. + {"base": $base}))' \
              "${package_matrix_file}" >"${package_matrix_file}.tmp"
            mv "${package_matrix_file}.tmp" "${package_matrix_file}"
          done < <(list_configured_bases)

          printf 'BASE_MATRIX=%s\n' "$(cat "${base_matrix_file}")" >>"${GITHUB_OUTPUT}"
          printf 'PACKAGE_MATRIX=%s\n' "$(cat "${package_matrix_file}")" >>"${GITHUB_OUTPUT}"

  from-images:
    name: "${{ matrix.base }}: Resolve FROM image"
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.BASE_MATRIX) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install resolver dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m pip uninstall -y yq

      - name: Resolve FROM image
        env:
          BASE_ALIAS: ${{ matrix.base }}
        run: |
          set -euo pipefail
          scripts/from-images/resolve.sh "${BASE_ALIAS}"

      - name: Prepare FROM image artifact
        env:
          BASE_ALIAS: ${{ matrix.base }}
        run: |
          set -euo pipefail
          mkdir -p "from-image-artifact/bases/${BASE_ALIAS}"
          cp "bases/${BASE_ALIAS}/from-image.env" "from-image-artifact/bases/${BASE_ALIAS}/"

      - name: Upload FROM image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: from-image-${{ matrix.base }}
          path: from-image-artifact/bases

  resolve:
    name: "${{ matrix.base }}/${{ matrix.arch }}: Resolve package versions"
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.PACKAGE_MATRIX) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install resolver dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m pip uninstall -y yq

      - name: Resolve package versions
        env:
          BASE_ALIAS: ${{ matrix.base }}
        run: |
          set -euo pipefail
          scripts/packages/resolve.sh "${BASE_ALIAS}"

      - name: Prepare package version artifact
        env:
          ARCH: ${{ matrix.arch }}
          BASE_ALIAS: ${{ matrix.base }}
        run: |
          set -euo pipefail
          mkdir -p "package-version-artifact/bases/${BASE_ALIAS}/packages"
          cp \
            "bases/${BASE_ALIAS}/packages/${ARCH}.yml" \
            "bases/${BASE_ALIAS}/packages/${ARCH}.env" \
            "package-version-artifact/bases/${BASE_ALIAS}/packages/"

      - name: Upload package versions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: package-versions-${{ matrix.base }}-${{ matrix.arch }}
          path: package-version-artifact/bases

  commit:
    name: Commit base lock updates
    needs:
      - from-images
      - resolve
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    env:
      BASE_VERSION: ${{ inputs.base_version }}
      RELEASE_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download resolved versions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: "*"
          path: bases
          merge-multiple: true

      - name: Commit, tag, and push base lock release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lock_paths=(bases/*/from-image.env bases/*/packages)

          if [[ -z "$(git status --porcelain -- "${lock_paths[@]}")" ]]; then
            echo "No base lock changes detected."
            exit 0
          fi

          update_tag="${BASE_VERSION}-$(date -u +%Y%m%dT%H%M)"
          if git ls-remote --exit-code --tags origin "refs/tags/${update_tag}" >/dev/null; then
            echo "Tag ${update_tag} already exists." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${lock_paths[@]}"
          git commit -m "Update base locks"
          git tag "${update_tag}"
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${RELEASE_BRANCH}"
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/${update_tag}"
